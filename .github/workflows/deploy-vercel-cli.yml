name: MADSI release validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsi-release-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Record production release restriction
        if: always()
        shell: bash
        run: |
          printf '%s\\n' 'Production deployment is blocked. This workflow performs source validation only.' 'Inspect individual step outcomes; no live acceptance tests are performed here.' 'Before restoring deployment: verify the existing custom-domain project, production backend, credentials and acceptance evidence, then obtain release approval.' >> "$GITHUB_STEP_SUMMARY"
          echo '::notice::No deployment requested. No live acceptance or launch readiness claimed.'
