name: MADSI Neon PR branches

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: madsi-neon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-neon-branch:
    name: Create or refresh isolated Neon branch
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set branch expiration
        id: expiry
        shell: bash
        run: echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch for this pull request
        id: create_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          database: madsi_staging
          role: madsi_staging
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply Facebook migration to this PR's isolated database
        env:
          NEON_DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ]; then
            echo "::error::Neon did not return a connection URL for the PR branch."
            exit 1
          fi
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261128000100_madsi_facebook.sql
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261128000200_madsi_facebook_neon_auth_decoupling.sql

      - name: Verify isolated database schema and RLS
        env:
          NEON_DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            expected text[] := ARRAY[
              'madsi_facebook_oauth_states',
              'madsi_facebook_connections',
              'madsi_facebook_publish_approvals'
            ];
            actual_count integer;
            rls_count integer;
            auth_fk_count integer;
            policy_count integer;
          BEGIN
            SELECT count(*) INTO actual_count
            FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name = ANY(expected)
              AND table_type = 'BASE TABLE';
            IF actual_count <> 3 THEN
              RAISE EXCEPTION 'Expected all 3 MADSI Facebook tables; found %', actual_count;
            END IF;

            SELECT count(*) INTO rls_count
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relname = ANY(expected)
              AND c.relrowsecurity;
            IF rls_count <> 3 THEN
              RAISE EXCEPTION 'RLS must be enabled on all 3 MADSI Facebook tables; found %', rls_count;
            END IF;

            SELECT count(*) INTO auth_fk_count
            FROM pg_constraint c
            JOIN pg_class t ON t.oid = c.conrelid
            JOIN pg_namespace n ON n.oid = t.relnamespace
            JOIN pg_class referenced ON referenced.oid = c.confrelid
            JOIN pg_namespace referenced_schema ON referenced_schema.oid = referenced.relnamespace
            WHERE n.nspname = 'public'
              AND t.relname = ANY(expected)
              AND c.contype = 'f'
              AND referenced_schema.nspname = 'auth'
              AND referenced.relname = 'users';
            IF auth_fk_count <> 0 THEN
              RAISE EXCEPTION 'Neon staging tables must not depend on Supabase Auth foreign keys; found %', auth_fk_count;
            END IF;

            SELECT count(*) INTO policy_count
            FROM pg_policies
            WHERE schemaname = 'public'
              AND tablename = ANY(expected)
              AND policyname = 'madsi_staging_backend_access'
              AND roles @> ARRAY['madsi_staging']::name[];
            IF policy_count <> 3 THEN
              RAISE EXCEPTION 'Expected private Neon backend RLS policies on all 3 tables; found %', policy_count;
            END IF;
          END
          $verify$;
          SQL

  delete-neon-branch:
    name: Delete isolated Neon branch when PR closes
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
