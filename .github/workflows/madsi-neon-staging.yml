name: MADSI Neon staging database

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the existing Neon staging schema without reapplying the migration
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: madsi-neon-staging
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.ref == 'refs/heads/feat/madsi-facebook-cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
    steps:
      - name: Check out the MADSI feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/madsi-facebook-cloudflare
          persist-credentials: false

      - name: Require the isolated MADSI Neon staging database
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ]; then
            echo "::error::Add NEON_STAGING_DATABASE_URL as a GitHub Actions secret. Use the MADSI-Staging project and madsi_staging database only; never use a production connection string."
            exit 1
          fi
          if [[ "$NEON_DATABASE_URL" != postgres://* && "$NEON_DATABASE_URL" != postgresql://* ]]; then
            echo "::error::NEON_STAGING_DATABASE_URL must be a PostgreSQL connection URL."
            exit 1
          fi
          if [[ "$NEON_DATABASE_URL" != *"ep-morning-lake-be1pzja7-pooler.c-9.us-east-2.aws.neon.tech"* || "$NEON_DATABASE_URL" != *"/madsi_staging"* ]]; then
            echo "::error::Refusing to run: connection URL must target the MADSI-Staging Neon endpoint and database madsi_staging."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply Facebook integration migration
        if: ${{ !inputs.verify_only }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261128000100_madsi_facebook.sql
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261128000200_madsi_facebook_neon_auth_decoupling.sql

      - name: Verify staging schema and row-level security
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            expected text[] := ARRAY[
              'madsi_facebook_oauth_states',
              'madsi_facebook_connections',
              'madsi_facebook_publish_approvals'
            ];
            actual_count integer;
            rls_count integer;
            auth_fk_count integer;
            policy_count integer;
          BEGIN
            SELECT count(*) INTO actual_count
            FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name = ANY(expected)
              AND table_type = 'BASE TABLE';
            IF actual_count <> 3 THEN
              RAISE EXCEPTION 'Expected all 3 MADSI Facebook staging tables; found %', actual_count;
            END IF;

            SELECT count(*) INTO rls_count
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relname = ANY(expected)
              AND c.relrowsecurity;
            IF rls_count <> 3 THEN
              RAISE EXCEPTION 'RLS must be enabled on all 3 MADSI Facebook tables; found %', rls_count;
            END IF;

            SELECT count(*) INTO auth_fk_count
            FROM pg_constraint c
            JOIN pg_class t ON t.oid = c.conrelid
            JOIN pg_namespace n ON n.oid = t.relnamespace
            JOIN pg_class referenced ON referenced.oid = c.confrelid
            JOIN pg_namespace referenced_schema ON referenced_schema.oid = referenced.relnamespace
            WHERE n.nspname = 'public'
              AND t.relname = ANY(expected)
              AND c.contype = 'f'
              AND referenced_schema.nspname = 'auth'
              AND referenced.relname = 'users';
            IF auth_fk_count <> 0 THEN
              RAISE EXCEPTION 'Neon staging tables must not depend on Supabase Auth foreign keys; found %', auth_fk_count;
            END IF;

            SELECT count(*) INTO policy_count
            FROM pg_policies
            WHERE schemaname = 'public'
              AND tablename = ANY(expected)
              AND policyname = 'madsi_staging_backend_access'
              AND roles @> ARRAY['madsi_staging']::name[];
            IF policy_count <> 3 THEN
              RAISE EXCEPTION 'Expected private Neon backend RLS policies on all 3 tables; found %', policy_count;
            END IF;
          END
          $verify$;
          SQL
